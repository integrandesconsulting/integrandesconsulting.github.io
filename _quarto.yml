project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"

website:
  title: "Integrandes"
  favicon: images/logo_temp.png
  open-graph: true
  site-url: https://integrandesconsulting.github.io/
  navbar:
    logo: images/logo_temp.png
    collapse-level: 1
    right:
      - href: index.qmd
        text: Inicio
      - href: servicios.qmd
        text: Servicios
      - href: portafolio.qmd
        text: Portafolio
      - href: equipo.qmd
        text: Equipo
      - href: contacto.qmd
        text: Contacto
  page-footer:
    border: true
    center:
      - icon: twitter
        href: https://twitter.com/TU_USUARIO
      - icon: facebook
        href: https://www.facebook.com/integrandes.co
      - icon: linkedin
        href: https://www.linkedin.com/in/TU_USUARIO/
    right: "Copyright ©"

format:
  html:
    theme:
      light: sandstone
      dark: darkly
    css: styles.css
    toc: true
    toc-location: right
    include-after-body: remove-toggle-title.html

editor: visual
